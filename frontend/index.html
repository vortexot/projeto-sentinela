<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Hospital São Lucas</title>
<link rel="icon" href="img/logo.jpg">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-pagina="login">
<main class="login-wrap">
  <form class="login-card" id="form" novalidate>
    <img class="logo" src="img/logo.jpg" alt="Logo do Hospital São Lucas">
    <h1>Hospital São Lucas</h1>
    <p class="sub">Sistema de Gestão Hospitalar</p>

    <div class="erro" id="erro" role="alert"></div>

    <div class="field">
      <label for="usuario">Usuário</label>
      <input id="usuario" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
    </div>

    <button class="btn btn-block" id="entrar" type="submit">Entrar</button>
    <div class="rodape">© 2026 Hospital São Lucas</div>
  </form>
</main>

<script src="js/app.js"></script>
<script>
  // Quem já está logado vai direto para o seu setor
  const atual = App.usuario();
  if (atual) App.entrar(atual);

  // Atalho: Ctrl + Alt + A abre o cadastro de usuários
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.altKey && e.key.toLowerCase() === "a") {
      e.preventDefault();
      location.href = "admin.html";
    }
  });

  const erro = document.getElementById("erro");
  const botao = document.getElementById("entrar");

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    erro.classList.remove("visivel");
    botao.disabled = true;
    botao.textContent = "Entrando...";
    try {
      const r = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          usuario: document.getElementById("usuario").value,
          senha: document.getElementById("senha").value
        })
      });
      const dados = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(dados.erro || "Usuário ou senha inválidos.");
      App.entrar(dados);
    } catch (err) {
      erro.textContent = err instanceof TypeError ? "Não foi possível conectar ao servidor." : err.message;
      erro.classList.add("visivel");
      botao.disabled = false;
      botao.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
